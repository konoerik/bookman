name: Release

# Tag a commit on main as v<version> and push the tag:
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# This re-runs the checks on the tagged commit, builds the sdist and wheel
# with uv, and publishes a GitHub Release carrying both, so a consumer can
# depend on the wheel by URL until the project is on PyPI:
#
#   uv add "bookman @ https://github.com/konoerik/bookman/releases/download/v1.0.0/bookman-1.0.0-py3-none-any.whl"
#
# The tag must match pyproject.toml's version; the build fails otherwise.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --python 3.10
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type-check
        run: uv run mypy src/
      - name: Test
        run: uv run pytest

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Tag matches pyproject version
        id: version
        run: |
          version="$(uv version --short)"
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match pyproject version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build sdist and wheel
        run: uv build
      - name: Smoke-test the wheel in a clean environment
        run: |
          uv venv --python 3.10 /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/bookman --version
          /tmp/smoke/bin/python -c "import bookman; print(sorted(bookman.__all__))"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: false
          body: |
            See [CHANGELOG.md](https://github.com/konoerik/bookman/blob/${{ github.ref_name }}/CHANGELOG.md) for what changed.

            Install the wheel directly:

                uv add "bookman @ https://github.com/konoerik/bookman/releases/download/${{ github.ref_name }}/bookman-${{ steps.version.outputs.version }}-py3-none-any.whl"
